<style>
        .glass-panel {
            background: linear-gradient(180deg, rgba(30, 30, 46, 0.7) 0%, rgba(20, 20, 30, 0.8) 100%);

            border-color: rgba(222, 213, 255, 0.3);
        }
        
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .5;
                transform: scale(1.1);
            }
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top Navigation (Suppressed for focused live session, using minimal context header instead) -->
<header class="w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 border-b border-white/5">
<div class="flex items-center gap-4">
<span class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-bold text-primary">PrepWise</span>
<div class="h-4 w-[1px] bg-white/20 mx-2 hidden md:block"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider hidden md:block">Live Session</span>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>

</div>
<div class="font-label-caps text-label-caps text-on-surface-variant" id="timer">00:00:00</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col md:flex-row p-margin-mobile md:p-margin-desktop gap-gutter relative h-[calc(100vh-64px)]">
<!-- AI Interviewer Card -->
<section class="flex-1 glass-panel rounded-xl flex flex-col relative overflow-hidden glow-hover transition-all duration-300">
<!-- Visualizer Background -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">

<!-- Header -->

<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">AI Interviewer</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-2 uppercase tracking-wider">System Active</p>
</div>
<div class="bg-surface-container-high p-2 rounded-lg flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
</div>
<!-- Central Orb / Visualizer -->
<div class="flex-grow flex items-center justify-center z-10">
<div class="relative flex items-center justify-center">
<div class="absolute w-48 h-48 bg-primary/20 rounded-full blur-2xl pulse-ring"></div>
<div class="absolute w-32 h-32 bg-primary/40 rounded-full blur-xl pulse-ring" style="animation-delay: 0.5s;"></div>
<div class="w-24 h-24 bg-surface-container-highest rounded-full border-2 border-primary/50 flex items-center justify-center shadow-[0_0_30px_rgba(222,213,255,0.3)] z-20">
<span class="material-symbols-outlined text-4xl text-primary pulse-ring" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
</div>
<!-- Transcriptions/Status Footer -->
<div class="p-6 z-10 bg-surface-container/50 border-t border-white/5">
<p class="font-body-md text-body-md text-on-surface-variant text-center italic">"Tell me about a time you handled a difficult engineering challenge."</p>
</div>
</section>
<!-- User Card -->
<section class="flex-1 glass-panel rounded-xl flex flex-col relative overflow-hidden glow-hover transition-all duration-300">
<div class="absolute inset-0 z-0">
<img alt="User video feed" class="w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmIfHWLzGRHZcd7RjgVVA80hlR2SRzzvneM9tZEkgP9mMazsPYQd8_S_Eh7q7AI4gLYvXHlzSSVq42ebJkAtXfm-Q8CbG9XDx1EBkVMvCkWMX5T4_aMkexC_36W-r9YHwqihCkSqbOUTqM5KorJa9yqXTuKUf1vdWLSOTm8-kD0j2r40DyjZBdJMYsK7MyFZxL07zx8JSm7idTJOpaXM2DT54Y3Ou4EYK6WxfFKuc1kkTMSK-u-ahD_agfo4dFJTOPPUiYeaT688aX"/>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call_end</span>

</main>
<script>
        // Simple timer logic
        let seconds = 0;
        const timerElement = document.getElementById('timer');
        
        setInterval(() => {
            seconds++;
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            timerElement.textContent = 
                `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
